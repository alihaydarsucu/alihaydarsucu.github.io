name: Generate CV

on:
  push:
    branches: [main, v2, website-improvements]
    paths:
      - "cv/**" # Sadece cv klasöründeki değişiklikler için tetiklenir
  pull_request:
    branches: [main, v2]
    paths:
      - "cv/**" # Sadece cv klasöründeki değişiklikler için tetiklenir
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write

jobs:
  generate-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra texlive-luatex

      - name: Generate CV
        run: |
          cd cv
          lualatex cv.tex
          lualatex cv.tex  # İkinci kez çalıştır (cross-references için)

      - name: Copy CV to Assets directory
        run: |
          mkdir -p Assets
          date=$(date +'%d_%m_%Y')
          rm -f Assets/AliHaydarSucu_CV_*.pdf Assets/AliHaydarSucu_Resume_*.pdf
          cp cv/cv.pdf "Assets/AliHaydarSucu_CV_${date}.pdf"

      - name: Update HTML files with new CV link
        run: |
          date=$(date +'%d_%m_%Y')
          sed -E -i "s|Assets/AliHaydarSucu_CV_[0-9]{2}_[0-9]{2}_[0-9]{4}\.pdf|Assets/AliHaydarSucu_CV_${date}.pdf|g" index.html
          sed -E -i "s|Assets/AliHaydarSucu_CV_[0-9]{2}_[0-9]{2}_[0-9]{4}\.pdf|Assets/AliHaydarSucu_CV_${date}.pdf|g" tr.html

      - name: Commit and push CV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Assets/ index.html tr.html
          git commit -m "Auto-update CV - $(date +'%Y-%m-%d')" || exit 0
          git push
