name: Sync Local Blog Data

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başında
  workflow_dispatch:  # Manuel tetikleme

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Validate local blog data source
        run: |
          echo "Using local data/blog-posts.json managed by the admin panel."
          
      - name: Commit blog data
        run: |
          if git diff --quiet data/blog-posts.json; then
            echo "✅ No changes detected, skipping commit"
          else
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add data/blog-posts.json
            git add -A data/blog-content || true
            git commit -m "Auto-update blog posts - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
            echo "✅ Blog posts updated"
          fi
