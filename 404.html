    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        
        .error-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: block;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--dark-purple);
        }
        
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(58, 134, 255, 0.3);
            border: 2px solid var(--primary);
            margin-top: 1rem;
        }
        
        .home-link:hover {
            background: var(--orange);
            border-color: var(--orange);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 126, 29, 0.4);
            color: white;
        }
        
        .home-link i {
            font-size: 1.3rem;
        }
        
        body.dark-mode .error-message {
            color: var(--dark-text);
        }
        
        body.dark-mode .error-code {
            color: var(--primary);
        }
        
        body.dark-mode .home-link {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 6px 20px rgba(77, 148, 255, 0.3);
        }
        
        body.dark-mode .home-link:hover {
            background: var(--orange);
            border-color: var(--orange);
            box-shadow: 0 8px 25px rgba(255, 158, 61, 0.4);
        }
        
        body.dark-mode .loading-container {
            background: var(--dark-surface);
        }
        
        body.dark-mode .loading-text {
            color: var(--dark-text-secondary);
        }
        
        footer { margin-top: auto; }
    </style>
</head>
 <body>

                 </div>
                 <div class="nav-links" role="menubar">
                     <a href="/" class="active" role="menuitem"><i class="fas fa-user" aria-hidden="true"></i><span class="nav-text" data-en="About" data-tr="Hakkımda">About</span></a>

                     </div></div>

    <main role="main">
        <div class="error-container" role="alert" aria-live="polite">
            <div class="error-code" aria-label="Hata kodu">404</div>
            <div class="error-message" id="message">Page Not Found</div>
            <a href="/" class="home-link" id="homeLink" aria-label="Return to homepage">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span id="homeText">Return to Home</span>

     <script>
        (function () {
            const isTurkish = /^\/tr(?:\/|$)/.test(window.location.pathname);
            const homePath = isTurkish ? '/tr' : '/';
            const language = isTurkish ? 'tr' : 'en';
            const text = {
                en: { title: 'Page Not Found | Ali Haydar Sucu', message: 'Page Not Found', button: 'Return to Home', footer: 'Computer Engineering Student', nav: ['About', 'Skills', 'Projects', 'Experience', 'Photos'] },
                tr: { title: 'Sayfa Bulunamadı | Ali Haydar Sucu', message: 'Sayfa Bulunamadı', button: 'Ana Sayfaya Dön', footer: 'Bilgisayar Mühendisliği Öğrencisi', nav: ['Hakkımda', 'Yetenekler', 'Projeler', 'Deneyim', 'Fotoğraflar'] }
            }[language];
            const paths = isTurkish ? ['/tr', '/yetenekler', '/projeler', '/deneyim', '/fotograflar'] : ['/', '/skills', '/projects', '/experience', '/photos'];

            document.documentElement.lang = language;
            document.title = text.title;
            document.getElementById('message').textContent = text.message;
            document.getElementById('homeText').textContent = text.button;
            document.getElementById('homeLink').href = homePath;
            document.getElementById('homeLink').setAttribute('aria-label', text.button);
            document.getElementById('logoLink').href = homePath;
            document.getElementById('logoLink').setAttribute('aria-label', text.button);
            document.getElementById('logoImage').onclick = function () { window.location.href = homePath; };
            document.getElementById('footerText').textContent = text.footer;
            document.querySelector('nav').setAttribute('aria-label', isTurkish ? 'Ana navigasyon' : 'Main navigation');
            document.querySelectorAll('.nav-text').forEach(function (item, index) { item.textContent = text.nav[index]; });
            document.querySelectorAll('.nav-links a').forEach(function (link, index) { link.href = paths[index]; });
            document.querySelectorAll('.nav-text-mobile').forEach(function (item, index) { item.textContent = text.nav[index]; item.parentElement.href = paths[index]; });
            document.querySelector('.mobile-menu').setAttribute('aria-label', isTurkish ? 'Navigasyon menüsü' : 'Navigation menu');
            document.querySelector('.language-selector').setAttribute('aria-label', isTurkish ? 'Dil seçici' : 'Language selector');
            document.querySelector('.language-selector-toggle').setAttribute('aria-label', isTurkish ? 'Dil seçin' : 'Select language');
            document.querySelectorAll('.language-option')[isTurkish ? 1 : 0].classList.add('active');
        })();
     </script>
     <script src="/script.js"></script>
