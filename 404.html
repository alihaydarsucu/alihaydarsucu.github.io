    <title>Sayfa Bulunamadı | Ali Haydar Sucu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/Images/Icons/icon.svg">
    <link rel="apple-touch-icon" href="/Images/Icons/icon.svg">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--surface);
            z-index: 9999;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin: 0;
        }
        
        .error-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: none; /* Hidden initially */
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--dark-purple);
        }
        
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(58, 134, 255, 0.3);
            border: 2px solid var(--primary);
            margin-top: 1rem;
        }
        
        .home-link:hover {
            background: var(--orange);
            border-color: var(--orange);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 126, 29, 0.4);
            color: white;
        }
        
        .home-link i {
            font-size: 1.3rem;
        }
        
        body.dark-mode .error-message {
            color: var(--dark-text);
        }
        
        body.dark-mode .error-code {
            color: var(--primary);
        }
        
        body.dark-mode .home-link {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 6px 20px rgba(77, 148, 255, 0.3);
        }
        
        body.dark-mode .home-link:hover {
            background: var(--orange);
            border-color: var(--orange);
            box-shadow: 0 8px 25px rgba(255, 158, 61, 0.4);
        }
        
        body.dark-mode .loading-container {
            background: var(--dark-surface);
        }
        
        body.dark-mode .loading-text {
            color: var(--dark-text-secondary);
        }
        
        footer {
            margin-top: auto;
            display: none; /* Hidden initially */
        }
    </style>
</head>
 <body>
     <div class="loading-container" id="loadingContainer">
         <div class="spinner"></div>
         <p class="loading-text" id="loadingText">Loading...</p>
     </div>

     <header role="banner" style="display: none;">
         <!-- Header içeriği buraya -->
         <div class="container">
             <nav role="navigation" aria-label="Ana navigasyon">
                 <div class="logo">
                     <img src="/Images/Icons/icon.svg" alt="Ali Haydar Sucu logo" class="logo-img" onclick="window.location.href='/'">
                     <a href="/" id="logoLink" aria-label="Ana sayfaya dön">Ali Haydar Sucu</a>
                 </div>
             </nav>
         </div>
     </header>

    <main role="main" style="display: none;">
        <div class="error-container" role="alert" aria-live="polite">
            <div class="error-code" aria-label="Hata kodu">404</div>
            <div class="error-message" id="message">Sayfa Bulunamadı</div>
            <a href="/" class="home-link" id="homeLink" aria-label="Ana sayfaya dönmek için tıklayın">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span id="homeText">Ana Sayfaya Dön</span>
            </a>
        </div>
    </main>

    <footer role="contentinfo">
        <div class="footer-content">
            <p>&copy; Copyright 2026 - Ali Haydar Sucu</p>
        </div>
    </footer>

     <script>
        // ✅ 404 Trick for direct clean URL access - Execute immediately
        (function() {
            const path = window.location.pathname;
            const loadingContainer = document.getElementById('loadingContainer');
            const loadingText = document.getElementById('loadingText');
            
            // Blog page routing - /posts -> blog-en.html, /yazilar -> blog-tr.html
            if (path === '/posts' || path === '/posts/') {
                // Handle blog filtering with parameters - /posts?category=technical
                const fullUrl = window.location.href;
                sessionStorage.setItem('intendedBlogUrl', fullUrl);
                window.location.replace('/blog-en.html' + window.location.search);
                return;
            } else if (path === '/yazilar' || path === '/yazilar/') {
                // Handle blog filtering with parameters - /yazilar?category=technical
                const fullUrl = window.location.href;
                sessionStorage.setItem('intendedBlogUrl', fullUrl);
                window.location.replace('/blog-tr.html' + window.location.search);
                return;
            } else if (path.startsWith('/yazilar/')) {
                // Article routing - /yazilar/<slug> -> article-tr.html?slug=<slug>
                const slug = path.replace('/yazilar/', '');
                sessionStorage.setItem('redirectSlug', slug);
                window.location.replace('/article-tr.html?slug=' + encodeURIComponent(slug));
                return;
            } else if (path.startsWith('/posts/')) {
                // Article routing - /posts/<slug> -> article-en.html?slug=<slug>
                const slug = path.replace('/posts/', '');
                sessionStorage.setItem('redirectSlug', slug);
                window.location.replace('/article-en.html?slug=' + encodeURIComponent(slug));
                return;
            }
            
            // If no redirect, show the 404 page
            setTimeout(() => {
                loadingContainer.style.display = 'none';
                document.querySelector('header').style.display = 'block';
                document.querySelector('main').style.display = 'block';
                document.querySelector('footer').style.display = 'block';
                
                const messageEl = document.getElementById('message');
                const homeTextEl = document.getElementById('homeText');
                const homeLinkEl = document.getElementById('homeLink');
                const logoLinkEl = document.getElementById('logoLink');

                const normalizePath = (p) => {
                    if (!p) return '/';
                    const withoutTrailing = p.length > 1 ? p.replace(/\/+$/, '') : p;
                    return withoutTrailing || '/';
                };

                const currentPath = normalizePath(window.location.pathname);
                const segments = currentPath.split('/').filter(Boolean);

                const referrer = document.referrer || '';
                const referrerPath = (() => {
                    try {
                        return normalizePath(new URL(referrer).pathname);
                    } catch (e) {
                        return '';
                    }
                })();

                const referrerLooksTurkish =
                    referrerPath === '/tr' ||
                    referrerPath.endsWith('/tr.html') ||
                    referrerPath.startsWith('/yazilar') ||
                    referrerPath.startsWith('/yetenekler') ||
                    referrerPath.startsWith('/projeler') ||
                    referrerPath.startsWith('/deneyim') ||
                    referrerPath.startsWith('/fotograflar') ||
                    referrerPath.startsWith('/yonetim');

                const referrerLooksEnglish =
                    referrerPath === '/' ||
                    referrerPath.endsWith('/index.html') ||
                    referrerPath.startsWith('/posts') ||
                    referrerPath.startsWith('/skills') ||
                    referrerPath.startsWith('/projects') ||
                    referrerPath.startsWith('/experience') ||
                    referrerPath.startsWith('/photos') ||
                    referrerPath.startsWith('/admin');

                const browserLang = (navigator.language || 'en').substring(0, 2);
                const isTurkish = referrerLooksTurkish ? true : (referrerLooksEnglish ? false : (browserLang === 'tr'));

                if (isTurkish) {
                    messageEl.textContent = 'Sayfa Bulunamadı';
                    homeTextEl.textContent = 'Ana Sayfaya Dön';
                    document.title = 'Sayfa Bulunamadı | Ali Haydar Sucu';
                    homeLinkEl.href = '/tr';
                    logoLinkEl.href = '/tr';
                    loadingText.textContent = 'Yükleniyor...';
                } else {
                    messageEl.textContent = 'Page Not Found';
                    homeTextEl.textContent = 'Return to Home';
                    document.title = 'Page Not Found | Ali Haydar Sucu';
                    homeLinkEl.href = '/';
                    logoLinkEl.href = '/';
                    loadingText.textContent = 'Loading...';
                }
            }, 100); // Small delay to ensure loading state is visible
        })();
     </script>
 </body>
 </html>
