<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:description" content="Aradığınız sayfa bulunamadı. Ali Haydar Sucu'nun kişisel web sitesine dönmek için tıklayın.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://alihaydarsucu.github.io/404.html">
    <meta property="twitter:title" content="Sayfa Bulunamadı | Ali Haydar Sucu">
    <meta property="twitter:description" content="Aradığınız sayfa bulunamadı. Ali Haydar Sucu'nun kişisel web sitesine dönmek için tıklayın.">
    <meta property="twitter:image" content="https://alihaydarsucu.github.io/Images/og-image.webp">
    <meta name="twitter:creator" content="@alihaydarsucu">
    
    <!-- Canonical -->
    <link rel="canonical" href="https://alihaydarsucu.github.io/404.html" />
    
    <!-- Hreflang -->
    <link rel="alternate" hreflang="tr" href="https://alihaydarsucu.github.io/404.html" />
    <link rel="alternate" hreflang="en" href="https://alihaydarsucu.github.io/en/404.html" />
    
    <title>Sayfa Bulunamadı | Ali Haydar Sucu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="/Images/Icons/icon.webp">
    <link rel="apple-touch-icon" href="/Images/Icons/icon.webp">
    <meta name="theme-color" content="#2563eb">
    <link rel="stylesheet" href="/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        
        .error-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--dark-purple);
        }
        
        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(58, 134, 255, 0.3);
            border: 2px solid var(--primary);
            margin-top: 1rem;
        }
        
        .home-link:hover {
            background: var(--orange);
            border-color: var(--orange);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 126, 29, 0.4);
            color: white;
        }
        
        .home-link i {
            font-size: 1.3rem;
        }
        
        body.dark-mode .error-message {
            color: var(--dark-text);
        }
        
        body.dark-mode .error-code {
            color: var(--primary);
        }
        
        body.dark-mode .home-link {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 6px 20px rgba(77, 148, 255, 0.3);
        }
        
        body.dark-mode .home-link:hover {
            background: var(--orange);
            border-color: var(--orange);
            box-shadow: 0 8px 25px rgba(255, 158, 61, 0.4);
        }
        
        footer {
            margin-top: auto;
        }
    </style>
</head>
 <body>
     <header role="banner">
         <!-- Header içeriği buraya -->
         <div class="container">
             <nav role="navigation" aria-label="Ana navigasyon">
                 <div class="logo">
                     <img src="/Images/Icons/icon.webp" alt="Ali Haydar Sucu logosu" class="logo-img">
                     <a href="/" id="logoLink" aria-label="Ana sayfaya dön">Ali Haydar Sucu</a>
                 </div>
             </nav>
         </div>
     </header>

    <main role="main">
        <div class="error-container" role="alert" aria-live="polite">
            <div class="error-code" aria-label="Hata kodu">404</div>
            <div class="error-message" id="message">Sayfa Bulunamadı</div>
            <a href="/" class="home-link" id="homeLink" aria-label="Ana sayfaya dönmek için tıklayın">
                <i class="fas fa-home" aria-hidden="true"></i>
                <span id="homeText">Ana Sayfaya Dön</span>
            </a>
        </div>
    </main>

    <footer role="contentinfo">
        <div class="footer-content">
            <p>&copy; Copyright 2026 - Ali Haydar Sucu</p>
        </div>
    </footer>

     <script>
        // Basit dil algılama ve yönlendirme
        document.addEventListener('DOMContentLoaded', function() {
            const messageEl = document.getElementById('message');
            const homeTextEl = document.getElementById('homeText');
            const homeLinkEl = document.getElementById('homeLink');
            const logoLinkEl = document.getElementById('logoLink');

            const normalizePath = (p) => {
                if (!p) return '/';
                const withoutTrailing = p.length > 1 ? p.replace(/\/+$/, '') : p;
                return withoutTrailing || '/';
            };

            const currentPath = normalizePath(window.location.pathname);
            const segments = currentPath.split('/').filter(Boolean);

            const redirectTo = (targetUrl) => {
                window.location.replace(targetUrl);
            };

            // GitHub Pages clean URL fallback routing
            if (currentPath === '/tr') {
                return redirectTo('/tr.html');
            }
            if (currentPath === '/skills') {
                return redirectTo('/skills.html');
            }
            if (currentPath === '/yetenekler') {
                return redirectTo('/yetenekler.html');
            }
            if (currentPath === '/projects') {
                return redirectTo('/projects.html');
            }
            if (currentPath === '/projeler') {
                return redirectTo('/projeler.html');
            }
            if (currentPath === '/experience') {
                return redirectTo('/experience.html');
            }
            if (currentPath === '/deneyim') {
                return redirectTo('/deneyim.html');
            }
            if (currentPath === '/photos') {
                return redirectTo('/photos.html');
            }
            if (currentPath === '/fotograflar') {
                return redirectTo('/fotograflar.html');
            }
            if (currentPath === '/posts') {
                return redirectTo('/blog-en.html');
            }
            if (currentPath === '/yazilar') {
                return redirectTo('/blog-tr.html');
            }
            if (currentPath === '/admin') {
                return redirectTo('/admin.html');
            }
            if (currentPath === '/yonetim') {
                return redirectTo('/yonetim.html');
            }

            if (segments.length >= 2 && segments[0] === 'posts') {
                const slug = segments.slice(1).join('/');
                return redirectTo(`/article-en.html?slug=${encodeURIComponent(slug)}`);
            }
            if (segments.length >= 2 && segments[0] === 'yazilar') {
                const slug = segments.slice(1).join('/');
                return redirectTo(`/article-tr.html?slug=${encodeURIComponent(slug)}`);
            }

            const referrer = document.referrer || '';
            const referrerPath = (() => {
                try {
                    return normalizePath(new URL(referrer).pathname);
                } catch (e) {
                    return '';
                }
            })();

            const referrerLooksTurkish =
                referrerPath === '/tr' ||
                referrerPath.endsWith('/tr.html') ||
                referrerPath.startsWith('/yazilar') ||
                referrerPath.startsWith('/yetenekler') ||
                referrerPath.startsWith('/projeler') ||
                referrerPath.startsWith('/deneyim') ||
                referrerPath.startsWith('/fotograflar') ||
                referrerPath.startsWith('/yonetim');

            const referrerLooksEnglish =
                referrerPath === '/' ||
                referrerPath.endsWith('/index.html') ||
                referrerPath.startsWith('/posts') ||
                referrerPath.startsWith('/skills') ||
                referrerPath.startsWith('/projects') ||
                referrerPath.startsWith('/experience') ||
                referrerPath.startsWith('/photos') ||
                referrerPath.startsWith('/admin');

            const browserLang = (navigator.language || 'en').substring(0, 2);
            const isTurkish = referrerLooksTurkish ? true : (referrerLooksEnglish ? false : (browserLang === 'tr'));

            if (isTurkish) {
                messageEl.textContent = 'Sayfa Bulunamadı';
                homeTextEl.textContent = 'Ana Sayfaya Dön';
                document.title = 'Sayfa Bulunamadı | Ali Haydar Sucu';
                homeLinkEl.href = '/tr';
                logoLinkEl.href = '/tr';
            } else {
                messageEl.textContent = 'Page Not Found';
                homeTextEl.textContent = 'Return to Home';
                document.title = 'Page Not Found | Ali Haydar Sucu';
                homeLinkEl.href = '/';
                logoLinkEl.href = '/';
            }
        });
     </script>
 </body>
 </html>
