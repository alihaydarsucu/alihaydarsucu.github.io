<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/Images/Icons/icon.webp">
  <base href="/">
  <style>
        .photos-shell{padding-top:1rem;padding-bottom:2rem}
        .photos-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1.25rem;margin-bottom:1.5rem}
        .photos-heading-group{max-width:62ch}
        .photos-header .section-title{margin-bottom:.4rem}
        .photos-intro{margin:0;color:var(--text-secondary,#5a5a5a)}

        .photo-grid{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
        .photo-filters{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;align-self:flex-start;padding-top:.35rem}
    .filter-btn{padding:.55rem .85rem;border-radius:999px;border:1px solid var(--muted,#ccc);background:var(--surface,#fff);cursor:pointer;text-align:left;white-space:nowrap}
    .filter-btn.active{background:var(--accent,#111);color:#fff;border-color:var(--accent,#111)}
    .photo-item{display:inline-block;border:0;padding:0;background:transparent;text-align:left;animation:photoFadeUp .28s ease both}
    /* fixed height, width determined by image aspect ratio */
    .photo-item img{height:280px;width:auto;object-fit:cover;border-radius:12px;display:block;box-shadow:0 10px 26px rgba(0,0,0,.14)}
    .photo-title{font-size:.95rem;margin-top:.45rem;color:var(--text-primary,#111)}

    /* Lightbox with smooth scale/opacity animation */
    .lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:999;opacity:0;transition:opacity .22s ease}
    .lightbox.open{opacity:1}
    .lb-content{max-width:92%;max-height:84%;text-align:center;transform:scale(.96);transition:transform .25s ease}
    .lightbox.open .lb-content{transform:scale(1)}
    .lb-image{max-width:100%;max-height:72vh;border-radius:8px}
    .lb-caption{color:#fff;margin-top:.6rem}
    .lb-prev,.lb-next,.lb-close{position:absolute;background:transparent;color:#fff;border:0;font-size:1.6rem;cursor:pointer}
    .lb-close{top:20px;right:20px}
    .lb-prev{left:20px}
    .lb-next{right:20px}
    @keyframes photoFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:900px){
            .photos-header{flex-direction:column}
            .photo-filters{justify-content:flex-start;padding-top:0}
      .photo-grid{order:1}
      .photo-item img{height:200px}
    }
  </style>
</head>
